services:
  - type: web
    name: pit-campus-hub
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: TEAM_PASSCODE
        value: pit2026
      - key: GEMINI_API_KEY
        sync: false
      - key: BACKBOARD_API_KEY
        sync: false
